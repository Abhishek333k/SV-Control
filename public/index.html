<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SV Deck</title>
    <style>
        * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: #11121A; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overscroll-behavior-y: none; }
        
        #auth-screen, #deck-screen, #loading-screen { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #deck-screen, #loading-screen { display: none; }

        .pin-input { background: #1E2030; border: 2px solid #565f89; color: #7dcfff; font-size: 32px; padding: 15px; border-radius: 10px; text-align: center; width: 200px; letter-spacing: 10px; margin-bottom: 20px; outline: none; }
        .btn-primary { background: #bb9af7; color: #11121A; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 90%; max-width: 400px; }
        .btn { background: #1E2030; border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 35px 10px; font-size: 16px; font-weight: bold; color: #c0caf5; text-align: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; }
        .btn:active { transform: scale(0.92); }
        .btn.active-red { background: #f7768e; color: #11121A; border-color: #f7768e; box-shadow: 0 0 20px rgba(247, 118, 142, 0.4); }
        .btn.error-flash { animation: errorPulse 0.4s ease; }
        @keyframes errorPulse {
            0%, 100% { background: #1E2030; border-color: rgba(255,255,255,0.05); }
            50% { background: #f7768e; border-color: #f7768e; box-shadow: 0 0 25px rgba(247, 118, 142, 0.6); }
        }

        /* Game Selector Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1E2030; border: 1px solid rgba(187,154,247,0.3); border-radius: 12px; padding: 20px; width: 90%; max-width: 350px; max-height: 70vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #bb9af7; font-size: 14px; letter-spacing: 1px; }
        .modal-close { background: none; border: none; color: #565f89; font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
        .modal-close:hover { color: #f7768e; }
        .game-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .game-item { background: #0D0E15; padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); color: #c0caf5; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s ease; }
        .game-item:active { background: #bb9af7; color: #11121A; }
        .empty-vault { color: #565f89; text-align: center; padding: 30px; font-size: 13px; }

        /* System Telemetry */
        .telemetry-bar { width: 90%; max-width: 400px; margin-bottom: 15px; }
        .telemetry-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .telemetry-label { color: #7dcfff; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
        .telemetry-value { color: #c0caf5; font-size: 12px; font-weight: 700; font-family: 'Consolas', monospace; }
        .progress-track { background: #0D0E15; border-radius: 6px; height: 8px; overflow: hidden; border: 1px solid rgba(125, 207, 255, 0.2); }
        .progress-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease, background-color 0.3s ease; }
        .progress-fill.cpu { background: linear-gradient(90deg, #7dcfff, #bb9af7); }
        .progress-fill.ram { background: linear-gradient(90deg, #bb9af7, #9d7cd8); }
        .progress-fill.warning { background: linear-gradient(90deg, #e0af68, #f7768e); }
        .progress-fill.critical { background: linear-gradient(90deg, #f7768e, #db4b4b); }

        /* Custom Macros Section */
        .section-title { color: #565f89; font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; margin: 20px 0 10px 0; }
        .workspace-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .workspace-tab { background: #1E2030; border: 1px solid rgba(187, 154, 247, 0.2); color: #c0caf5; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .workspace-tab:active { transform: scale(0.95); }
        .workspace-tab.active { background: #bb9af7; color: #11121A; border-color: #bb9af7; }
        .custom-macros-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 90%; max-width: 400px; }

        /* Clipboard Tools */
        .clipboard-tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 90%; max-width: 400px; margin-top: 15px; }
        .clipboard-btn { background: #1E2030; border: 1px solid rgba(125, 207, 255, 0.3); border-radius: 12px; padding: 15px 10px; font-size: 12px; font-weight: 600; color: #7dcfff; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .clipboard-btn:active { transform: scale(0.95); background: #7dcfff; color: #11121A; }
        .clipboard-btn .icon { font-size: 20px; }

        /* Clipboard Modal */
        .clipboard-modal-content { display: flex; flex-direction: column; gap: 12px; }
        .clipboard-input { background: #0D0E15; border: 1px solid rgba(125, 207, 255, 0.3); color: #c0caf5; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; min-height: 100px; resize: vertical; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #bb9af7; color: #11121A; padding: 12px 24px; border-radius: 25px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 2000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div id="loading-screen"><h3 style="color: #7dcfff;">Reconnecting...</h3></div>

    <div id="auth-screen">
        <h2 style="color: #565f89; margin-bottom: 30px;">ENTER PIN</h2>
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="pin-box" class="pin-input" placeholder="----" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <button class="btn-primary" onclick="attemptLogin()">CONNECT</button>
        <p id="error-msg" style="color: #f7768e; display: none; margin-top: 15px;">Invalid PIN</p>
    </div>

    <div id="deck-screen">
        <!-- System Telemetry -->
        <div class="telemetry-bar">
            <div class="telemetry-row">
                <span class="telemetry-label">CPU</span>
                <span class="telemetry-value" id="cpu-value">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill cpu" id="cpu-bar" style="width: 0%"></div>
            </div>
        </div>
        <div class="telemetry-bar">
            <div class="telemetry-row">
                <span class="telemetry-label">RAM</span>
                <span class="telemetry-value" id="ram-value">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill ram" id="ram-bar" style="width: 0%"></div>
            </div>
        </div>

        <h3 style="color: #565f89; margin: 20px 0 15px 0; letter-spacing: 2px;">COMMAND CENTER</h3>
        <div class="grid">
            <div class="btn" id="btn-MUTE_MIC" onclick="trigger('MUTE_MIC', this)"><span style="font-size: 24px;">🎙️</span> Mic Mute</div>
            <div class="btn" onclick="trigger('PLAY_MEDIA', this)"><span style="font-size: 24px;">⏯️</span> Play/Pause</div>
            <div class="btn" onclick="openGameSelector()"><span style="font-size: 24px;">🎮</span> Launch Game</div>
            <div class="btn" onclick="trigger('FLUSH_RAM', this)"><span style="font-size: 24px;">🚀</span> Flush RAM</div>
        </div>

        <h3 class="section-title">Custom Macros</h3>
        <div class="workspace-tabs" id="workspace-tabs"></div>
        <div class="custom-macros-grid" id="custom-macros-grid"></div>

        <h3 class="section-title">Clipboard Tools</h3>
        <div class="clipboard-tools">
            <div class="clipboard-btn" onclick="openClipboardModal()">
                <span class="icon">📤</span>
                <span>Send to PC</span>
            </div>
            <div class="clipboard-btn" onclick="fetchClipboardFromPc()">
                <span class="icon">📥</span>
                <span>Get from PC</span>
            </div>
        </div>
    </div>

    <!-- Game Selector Modal -->
    <div class="modal-overlay" id="game-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>🎮 SELECT GAME</h3>
                <button class="modal-close" onclick="closeGameSelector()">×</button>
            </div>
            <div class="game-list" id="game-list"></div>
        </div>
    </div>

    <!-- Clipboard Modal -->
    <div class="modal-overlay" id="clipboard-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>📤 SEND TO PC</h3>
                <button class="modal-close" onclick="closeClipboardModal()">×</button>
            </div>
            <div class="clipboard-modal-content">
                <textarea class="clipboard-input" id="clipboard-text" placeholder="Type text to send to PC clipboard..."></textarea>
                <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="sendClipboardToPc()">SEND TO PC</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Copied!</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // 🟢 THE FIX: Shift to localStorage
        let savedToken = localStorage.getItem('sv_token');
        let gameVault = [];
        let customActions = [];
        let currentWorkspace = 'Default';
        let lastActionBtn = null;
        const workspaces = ['Default', 'Streaming', 'Dev', 'Gaming', 'Productivity'];

        // Auto-Reconnect Logic
        socket.on('connect', () => {
            if (savedToken) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('deck-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';
                socket.emit('reconnect-session', savedToken);
            }
        });

        function attemptLogin() {
            const pin = document.getElementById('pin-box').value;
            socket.emit('authenticate', pin);
        }

        socket.on('auth-success', (data) => {
            // 🟢 THE FIX: Save to localStorage
            localStorage.setItem('sv_token', data.token);

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('deck-screen').style.display = 'flex';

            if (data.micMuted) document.getElementById('btn-MUTE_MIC').classList.add('active-red');
            if (data.customActions) {
                customActions = data.customActions;
                renderWorkspaceTabs();
                renderCustomMacros();
            }
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
        });

        socket.on('auth-failed', () => {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('error-msg').style.display = 'block';
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        });

        // The Scorch Earth Protocol (PC kicked us or 5 mins passed)
        socket.on('session-expired', () => {
            // 🟢 THE FIX: Wipe from localStorage
            localStorage.removeItem('sv_token');
            savedToken = null;

            document.getElementById('pin-box').value = '';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('deck-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        });

        function trigger(actionId, btnElement) {
            lastActionBtn = btnElement;
            socket.emit('trigger-action', actionId);
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // Game Vault Functions
        function openGameSelector() {
            socket.emit('get-game-vault');
        }

        function closeGameSelector() {
            document.getElementById('game-modal').classList.remove('active');
        }

        function renderGameSelector(games) {
            const listEl = document.getElementById('game-list');

            if (games.length === 0) {
                listEl.innerHTML = '<div class="empty-vault">No games in vault. Add games from the PC first!</div>';
                return;
            }

            listEl.innerHTML = games.map(game => `
                <div class="game-item" onclick="launchGame('${game.path.replace(/\\/g, '\\\\')}')">${escapeHTML(game.name)}</div>
            `).join('');

            document.getElementById('game-modal').classList.add('active');
        }

        function launchGame(gamePath) {
            socket.emit('trigger-action', 'LAUNCH_GAME', gamePath);
            closeGameSelector();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function triggerErrorHaptic(btnElement) {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            if (btnElement) {
                btnElement.classList.add('error-flash');
                setTimeout(() => btnElement.classList.remove('error-flash'), 400);
            }
        }

        socket.on('state-update', (data) => {
            if (data.actionId === 'MUTE_MIC') {
                const btn = document.getElementById('btn-MUTE_MIC');
                if (data.state) {
                    btn.classList.add('active-red');
                    if (navigator.vibrate) navigator.vibrate([50]);
                } else {
                    btn.classList.remove('active-red');
                    if (navigator.vibrate) navigator.vibrate([20]);
                }
            }
        });

        socket.on('action-failed', (data) => {
            triggerErrorHaptic(lastActionBtn);
            lastActionBtn = null;
        });

        socket.on('game-vault', (games) => {
            gameVault = games;
            renderGameSelector(games);
        });

        socket.on('telemetry-update', (data) => {
            updateTelemetry(data.cpu, data.ram);
        });

        socket.on('custom-actions-updated', (actions) => {
            customActions = actions;
            renderWorkspaceTabs();
            renderCustomMacros();
        });

        function updateTelemetry(cpu, ram) {
            const cpuBar = document.getElementById('cpu-bar');
            const cpuValue = document.getElementById('cpu-value');
            const ramBar = document.getElementById('ram-bar');
            const ramValue = document.getElementById('ram-value');

            cpuBar.style.width = cpu + '%';
            cpuValue.textContent = cpu + '%';
            cpuBar.className = 'progress-fill cpu' + (cpu >= 80 ? ' warning' : '') + (cpu >= 95 ? ' critical' : '');

            ramBar.style.width = ram + '%';
            ramValue.textContent = ram + '%';
            ramBar.className = 'progress-fill ram' + (ram >= 80 ? ' warning' : '') + (ram >= 95 ? ' critical' : '');
        }

        function renderCustomMacros() {
            const grid = document.getElementById('custom-macros-grid');
            const filtered = customActions.filter(a => a.workspace === currentWorkspace);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #565f89; font-size: 12px; padding: 20px;">No macros in this workspace</div>';
                return;
            }
            grid.innerHTML = filtered.map(action => `
                <div class="macro-btn" onclick="triggerCustomAction('${action.id}', this)">
                    <span class="macro-emoji">${escapeHTML(action.emoji)}</span>
                    <span>${escapeHTML(action.name)}</span>
                </div>
            `).join('');
        }

        function renderWorkspaceTabs() {
            const tabsEl = document.getElementById('workspace-tabs');
            tabsEl.innerHTML = workspaces.map(ws => `
                <div class="workspace-tab ${ws === currentWorkspace ? 'active' : ''}" onclick="switchWorkspace('${ws}')">${ws}</div>
            `).join('');
        }

        function switchWorkspace(workspace) {
            currentWorkspace = workspace;
            renderWorkspaceTabs();
            renderCustomMacros();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function triggerCustomAction(actionId, btnElement) {
            lastActionBtn = btnElement;
            socket.emit('trigger-action', actionId);
            if (navigator.vibrate) navigator.vibrate(20);
        }

        // Clipboard Functions
        function openClipboardModal() {
            document.getElementById('clipboard-modal').classList.add('active');
            document.getElementById('clipboard-text').value = '';
        }

        function closeClipboardModal() {
            document.getElementById('clipboard-modal').classList.remove('active');
        }

        async function sendClipboardToPc() {
            const text = document.getElementById('clipboard-text').value;
            if (!text.trim()) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                return;
            }
            const success = await window.svHost.syncClipboardToPc(text);
            if (success) {
                showToast('Sent to PC!');
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                closeClipboardModal();
            } else {
                showToast('Failed to send');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }

        async function fetchClipboardFromPc() {
            try {
                const text = await window.svHost.fetchClipboardFromPc();
                if (text) {
                    await navigator.clipboard.writeText(text);
                    showToast('Copied!');
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                } else {
                    showToast('PC clipboard is empty');
                    if (navigator.vibrate) navigator.vibrate(20);
                }
            } catch (err) {
                showToast('Failed to fetch');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
